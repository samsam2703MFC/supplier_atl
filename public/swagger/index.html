<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TFB Supplier Portal — API documentation</title>
  <link rel="stylesheet" href="swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
    /* L'Atelier accents on top of the default Swagger UI theme */
    .swagger-ui .topbar { background: #8D1D2C; }
    .swagger-ui .topbar .download-url-wrapper { display: none; }
    .swagger-ui .info .title { font-weight: 500; }
    .swagger-ui .btn.authorize { color: #8D1D2C; border-color: #8D1D2C; }
    .swagger-ui .btn.authorize svg { fill: #8D1D2C; }
  </style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="swagger-ui-bundle.js"></script>
<script src="swagger-ui-standalone-preset.js"></script>
<script>
  window.onload = () => {
    window.ui = SwaggerUIBundle({
      url: 'openapi.json',
      dom_id: '#swagger-ui',
      deepLinking: true,
      docExpansion: 'none',
      defaultModelsExpandDepth: 1,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: 'StandaloneLayout',
    });
  };
</script>
</body>
</html>
